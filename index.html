<html>
<head>
<meta charset="UTF-hani">
<title>تولدت مبارکککک</title>
<style>
body {
font-family: "Cooper Black", sans-serif;
 background: linear-gradient(135deg, #85f387 0%, #e6ff41 45%, #85f387 100%);
  box-shadow: 0 8px 20px rgba(180, 7, 7, 0.063);
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
}

.card {
background:linear-gradient(135deg, #e6ff41 0%, #85f387 45%, #e6ff41 100%);
width: 320px;
padding: 40px;
border-radius: 30px;
text-align: center;
box-shadow: 0px 8px 15px rgba(255, 166, 0, 0.2);
animation: float 3s ease-in-out infinite;
}

.card img {
width: 180px;
height: 180px;
border-radius: 50%;
border: 3px solid #8d550d;
margin-bottom: 10px;
animation: spin 6s linear infinite;
}

.card h2 {
margin: 70px 0;
color: #d66413;
}

.card p {
color: #cf6f09;
font-size: 20px;
}

.btn {
 display: inline-block;
 margin-top: 15px;
 padding: 10px 20px;
 border-radius: 25px;
 background: #b0660b;
 color: #e5db13;
 text-decoration: none;
 transition: 0.3s;
 }

.btn:hover {
 background: #e2b607;
}

</style>
</head>
<body>
 <div class="card">
<img src="mom-.png" alt="profile">
 <h2> ❤️!مامان قشنگم، تولدت مبارک</h2>
<p>هر سال که می‌گذرد، بیشتر می‌فهمم که 
    داشتنِ تو بزرگترین داراییِ من است</p>
<p>ممنون که همیشه با تمام وجود کنارم بودی و با مهربانی‌هایت دنیای من را رنگی کردی</p>
<P>امیدوارم سال جدید زندگی‌ات پر از خنده و سلامتی باشد، دقیقاً همان‌طور که تو لایقش هستی</P>
<p>از طرف دخترای قشنگت</p>
<audio controls autoplay>
    <source src="tavalod-p.mp3" type="audio/mpeg">
        </audio>
</div>
</body>
</html>
